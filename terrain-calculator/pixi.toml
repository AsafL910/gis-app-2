[project]
name = "terrain-calculator"
version = "0.1.0"
description = "FastAPI terrain calculation service backed by GDAL VRT files"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
fastapi = ">=0.115.0,<1"
uvicorn = ">=0.30.0,<1"
gdal = ">=3.9.0,<4"

[tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
