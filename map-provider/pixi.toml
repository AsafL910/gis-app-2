[workspace]
authors = ["Asaf Lumer <asaflumer@gmail.com>"]
channels = [
    "conda-forge",
    "https://repo.anaconda.com/pkgs/main",
    "https://repo.anaconda.com/pkgs/r",
    "https://repo.anaconda.com/pkgs/msys2",
]
name = "map-server"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
dev = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8003"
start = "uvicorn src.main:app --host 0.0.0.0 --port 8003"
export-openapi = "python -m src.scripts.export_openapi"

[dependencies]
python = ">=3.11,<3.12"
fastapi = "*"
uvicorn = "*"
gdal = ">=3.10,<3.11"

